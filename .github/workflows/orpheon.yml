name: Build Orpheon IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26          # Xcode 16, arm64 runner
    timeout-minutes: 30

    steps:
      - name: Unzip project
        run: |
          # The repo root contains Orpheon-iOS.zip (committed as-is from the zip you got).
          unzip -q Orpheon-iOS.zip
          echo "PROJECT_ROOT=$PWD/Orpheon-iOS" >> $GITHUB_ENV

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show SDK + Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned)
        run: |
          cd "$PROJECT_ROOT"
          xcodebuild \
            -project Orpheon.xcodeproj \
            -scheme Orpheon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcpretty || true   # xcpretty may not be installed; raw output is fine

      - name: Package IPA
        run: |
          cd "$PROJECT_ROOT"
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found — check build log above"
            ls -R build/Build/Products/ || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Orpheon.ipa Payload
          rm -rf Payload
          echo "IPA_PATH=$PWD/Orpheon.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orpheon-${{ github.run_number }}
          path: ${{ env.PROJECT_ROOT }}/Orpheon.ipa
          retention-days: 14
